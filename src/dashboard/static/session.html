<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Vaidya · Session Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-green-700 text-white px-6 py-4 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center gap-4">
      <a href="/dashboard" class="text-green-200 hover:text-white text-sm font-medium">← Dashboard</a>
      <div>
        <h1 class="text-lg font-bold">🌾 Session Detail</h1>
        <p id="session-subtitle" class="text-green-300 text-xs"></p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-6 space-y-5">

    <!-- Session info card -->
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-3">Session Info</h2>
      <div id="session-info" class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
        <div class="col-span-4 text-gray-300 text-center py-4">Loading…</div>
      </div>
    </div>

    <!-- Recordings -->
    <div id="recordings-card" class="bg-white rounded-xl shadow p-5">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-3">Recordings</h2>
      <div id="recordings-content" class="text-gray-300 text-sm">Checking…</div>
    </div>

    <!-- Transcript -->
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-4">Conversation Transcript</h2>
      <div id="transcript" class="space-y-5">
        <div class="text-gray-300 text-sm text-center py-4">Loading…</div>
      </div>
    </div>

    <!-- Metrics table -->
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-3">Per-Turn Latency</h2>
      <div id="metrics-content"></div>
    </div>

    <!-- Errors -->
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wide mb-3">Errors &amp; Exceptions</h2>
      <div id="errors-content"><div class="text-gray-300 text-sm text-center py-3">Loading…</div></div>
    </div>

  </main>

  <script>
    const sessionId = new URLSearchParams(window.location.search).get('id');

    function fmtTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('en-IN', {
        timeZone: 'Asia/Kolkata',
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: true
      });
    }

    function fmtDur(s) {
      if (s == null) return '—';
      if (s < 60) return `${Math.round(s)}s`;
      return `${Math.floor(s/60)}m ${Math.round(s%60)}s`;
    }

    function ms(v) { return v != null ? Math.round(v) + 'ms' : '—'; }

    function escHtml(t) {
      return (t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function statusStyle(s) {
      const map = { completed:'background:#dcfce7;color:#15803d', error:'background:#fee2e2;color:#b91c1c',
                    dropped:'background:#fef9c3;color:#a16207', active:'background:#dbeafe;color:#1d4ed8' };
      return map[s] || 'background:#f3f4f6;color:#6b7280';
    }

    async function load() {
      const r = await fetch(`/dashboard/api/sessions/${sessionId}`);
      if (!r.ok) { document.body.innerHTML = '<p class="p-8 text-red-500">Session not found.</p>'; return; }
      const d = await r.json();

      document.title = `Farm Vaidya · ${d.caller_name || sessionId.slice(0,8)}`;
      document.getElementById('session-subtitle').textContent = `ID: ${d.id}`;

      // --- Session info ---
      document.getElementById('session-info').innerHTML = `
        <div>
          <p class="text-xs text-gray-400 mb-1">Caller</p>
          <p class="font-semibold text-gray-800">${escHtml(d.caller_name) || '—'}</p>
        </div>
        <div>
          <p class="text-xs text-gray-400 mb-1">Phone</p>
          <p class="text-gray-600">${escHtml(d.phone_number) || '—'}</p>
        </div>
        <div>
          <p class="text-xs text-gray-400 mb-1">Duration</p>
          <p class="text-gray-600">${fmtDur(d.duration_s)}</p>
        </div>
        <div>
          <p class="text-xs text-gray-400 mb-1">Status</p>
          <span style="${statusStyle(d.status)}" class="px-2 py-0.5 rounded-full text-xs font-medium capitalize">${d.status}</span>
        </div>
        <div>
          <p class="text-xs text-gray-400 mb-1">Started</p>
          <p class="text-gray-600 text-xs">${fmtTime(d.started_at)}</p>
        </div>
        <div>
          <p class="text-xs text-gray-400 mb-1">Ended</p>
          <p class="text-gray-600 text-xs">${fmtTime(d.ended_at)}</p>
        </div>
        <div>
          <p class="text-xs text-gray-400 mb-1">Turns</p>
          <p class="text-gray-600">${d.turns.length}</p>
        </div>
        <div class="col-span-1">
          <p class="text-xs text-gray-400 mb-1">Session ID</p>
          <p class="font-mono text-xs text-gray-400 truncate">${d.id}</p>
        </div>
      `;

      // --- Recording ---
      const convUrl = `/dashboard/recordings/${sessionId}_conversation.wav`;
      const convOk  = await fetch(convUrl, {method:'HEAD'}).then(r=>r.ok).catch(()=>false);
      document.getElementById('recordings-content').innerHTML = convOk
        ? `<div class="flex items-center gap-3">
             <span class="text-sm text-gray-600 w-28 shrink-0">🎙️ Conversation</span>
             <audio controls class="flex-1 h-9" src="${convUrl}"></audio>
             <a href="${convUrl}" download class="text-xs text-gray-400 hover:text-gray-600" title="Download">↓</a>
           </div>`
        : '<p class="text-gray-400 text-sm">No recording saved for this session.</p>';

      // --- Transcript ---
      const transcript = document.getElementById('transcript');
      if (!d.turns.length) {
        transcript.innerHTML = '<p class="text-gray-300 text-sm text-center py-4">No transcript available.</p>';
      } else {
        transcript.innerHTML = d.turns.map(t => {
          const ragHtml = t.rag_chunks && t.rag_chunks.length
            ? `<details class="mt-2 border-t border-green-100 pt-2">
                 <summary class="text-xs text-green-500 cursor-pointer select-none hover:text-green-700">
                   📚 RAG: ${t.rag_chunks.length} chunk${t.rag_chunks.length>1?'s':''} retrieved
                   ${t.top_score != null ? `· top score ${t.top_score.toFixed(3)}` : ''}
                 </summary>
                 ${t.rag_query ? `<p class="mt-1 text-xs text-gray-400 italic">Query: ${escHtml(t.rag_query)}</p>` : ''}
                 <div class="mt-1 space-y-1">
                   ${t.rag_chunks.map((c,i) => `
                     <p class="text-xs text-gray-500 leading-relaxed">
                       <span class="text-gray-400 mr-1">[${i+1}]</span>${escHtml((c.text||'').substring(0,200))}${(c.text||'').length>200?'…':''}
                     </p>`).join('')}
                 </div>
               </details>`
            : `<p class="mt-2 text-xs text-gray-300 border-t border-green-100 pt-2">📚 No KB context retrieved</p>`;

          return `
            <!-- Farmer bubble (right-aligned) -->
            <div class="flex justify-end">
              <div class="max-w-[78%]">
                <p class="text-xs text-blue-400 text-right mb-1">👤 Farmer · turn ${t.turn_number}</p>
                <div class="bg-blue-50 text-blue-900 rounded-2xl rounded-tr-sm px-4 py-3 text-sm leading-relaxed">
                  ${escHtml(t.farmer_text) || '<em class="text-blue-300">—</em>'}
                </div>
              </div>
            </div>

            <!-- Bot bubble (left-aligned) -->
            <div class="flex justify-start">
              <div class="max-w-[78%]">
                <p class="text-xs text-green-500 mb-1">🤖 Farm Vaidya</p>
                <div class="bg-green-50 text-green-900 rounded-2xl rounded-tl-sm px-4 py-3 text-sm leading-relaxed">
                  ${escHtml(t.bot_text) || '<em class="text-green-300">—</em>'}
                  ${ragHtml}
                </div>
                <p class="text-xs text-gray-300 mt-1 ml-1">
                  ${t.retrieval_latency_ms!=null?`RAG ${Math.round(t.retrieval_latency_ms)}ms`:''}
                  ${t.llm_latency_ms!=null?` · LLM ${Math.round(t.llm_latency_ms)}ms`:''}
                  ${t.tts_latency_ms!=null?` · TTS ${Math.round(t.tts_latency_ms)}ms`:''}
                </p>
              </div>
            </div>`;
        }).join('');
      }

      // --- Metrics table ---
      if (d.turns.length) {
        const hasMetrics = d.turns.some(t => t.retrieval_latency_ms || t.llm_latency_ms || t.tts_latency_ms);
        if (hasMetrics) {
          document.getElementById('metrics-content').innerHTML = `
            <div class="overflow-x-auto">
            <table class="w-full text-xs text-center">
              <thead class="text-gray-400 uppercase tracking-wide bg-gray-50">
                <tr>
                  <th class="py-2 px-3 text-left">Turn</th>
                  <th class="py-2 px-3">RAG</th>
                  <th class="py-2 px-3">LLM</th>
                  <th class="py-2 px-3">TTS</th>
                  <th class="py-2 px-3">E2E</th>
                </tr>
              </thead>
              <tbody class="divide-y text-gray-600">
                ${d.turns.map(t => {
                  // Use measured e2e from performance_metrics; fall back to sum of known stages
                  const e2e = t.e2e_latency_ms != null
                    ? Math.round(t.e2e_latency_ms) + 'ms'
                    : (() => {
                        const s = [t.retrieval_latency_ms, t.llm_latency_ms, t.tts_latency_ms]
                          .reduce((a,v) => v != null ? a + v : a, 0);
                        return s ? '~' + s + 'ms' : '—';
                      })();
                  return `<tr>
                    <td class="py-2 px-3 text-left text-gray-400">Turn ${t.turn_number}</td>
                    <td class="py-2 px-3">${ms(t.retrieval_latency_ms)}</td>
                    <td class="py-2 px-3">${ms(t.llm_latency_ms)}</td>
                    <td class="py-2 px-3">${ms(t.tts_latency_ms)}</td>
                    <td class="py-2 px-3 font-medium text-gray-700">${e2e}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
            </div>`;
        } else {
          document.getElementById('metrics-content').innerHTML = '<p class="text-gray-300 text-sm">Latency metrics not recorded for this session.</p>';
        }
      }
    }

    async function loadErrors() {
      const r = await fetch(`/dashboard/api/sessions/${sessionId}/errors`);
      const errors = r.ok ? await r.json() : [];
      const el = document.getElementById('errors-content');
      if (!errors.length) {
        el.innerHTML = '<p class="text-gray-300 text-sm text-center py-3">No errors recorded for this session.</p>';
        return;
      }
      const typeColor = {
        stt_empty:      'background:#fef9c3;color:#854d0e',
        llm_error:      'background:#fee2e2;color:#991b1b',
        retrieval_error:'background:#fce7f3;color:#9d174d',
        pipeline_error: 'background:#fee2e2;color:#991b1b',
      };
      el.innerHTML = `<div class="space-y-2">
        ${errors.map(e => {
          const style = typeColor[e.error_type] || 'background:#f3f4f6;color:#374151';
          const t = new Date(e.created_at).toLocaleTimeString('en-IN', {timeZone:'Asia/Kolkata', hour12:true});
          return `<div class="rounded-lg p-3 text-xs" style="${style}">
            <div class="flex items-center justify-between mb-1">
              <span class="font-semibold uppercase tracking-wide">${escHtml(e.error_type)}</span>
              <span class="opacity-60">${t}</span>
            </div>
            <p class="leading-relaxed">${escHtml(e.error_message)}</p>
            ${e.stack_trace ? `<details class="mt-1"><summary class="cursor-pointer opacity-60 hover:opacity-100">Stack trace</summary><pre class="mt-1 text-xs overflow-x-auto whitespace-pre-wrap opacity-70">${escHtml(e.stack_trace.substring(0,800))}</pre></details>` : ''}
          </div>`;
        }).join('')}
      </div>`;
    }

    if (sessionId) { load(); loadErrors(); }
    else document.body.innerHTML = '<p class="p-8 text-red-500">No session ID in URL. Return to <a href="/dashboard" class="underline">dashboard</a>.</p>';
  </script>
</body>
</html>
