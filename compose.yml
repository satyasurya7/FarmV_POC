# Podman Compose — Farm Vaidya Telugu Voice Agent
# Usage:  podman compose up -d
#         podman compose logs -f voice_agent
#         podman compose down

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: farmvaidya_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmvaidya}
      POSTGRES_USER: ${POSTGRES_USER:-farmvaidya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # :z = shared SELinux label (required for bind mounts on Fedora/RHEL)
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro,z
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER:-farmvaidya} -d ${POSTGRES_DB:-farmvaidya}"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  voice_agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmvaidya_agent
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/vertex-ai-project-494805-0340a8a815b9.json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      # :ro,z = read-only + shared SELinux label
      - ./credentials:/app/credentials:ro,z
      - ./knowledge_base:/app/knowledge_base:ro,z
      # recordings must be writable and persist across restarts
      - ./data/recordings:/app/data/recordings:z
    ports:
      - "${SERVER_PORT:-8765}:8765"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:
