version: "2"

# Authenticate once: ngrok config add-authtoken <your-token>
# Start:            ngrok start --config ngrok.yml farmvaidya
# Start both:       ngrok start --all --config ngrok.yml

tunnels:
  farmvaidya:
    proto: http
    addr: 8765
    # Single tunnel for all traffic — HTTP (health/metrics/dashboard) + WebSocket (wss://)
    # Give Tata Tele SmartFlo: wss://<subdomain>.ngrok-free.app/ws/smartflo
    # Health:    https://<subdomain>.ngrok-free.app/health
    # Metrics:   https://<subdomain>.ngrok-free.app/metrics
    # Dashboard: https://<subdomain>.ngrok-free.app/dashboard
